[project]
name = "pygraphon"
version = "0.5.0-dev"
description = "python library to work with graphon"
readme = "README.md"
authors = [
    { name = "Charles Dufour & Arthur Verdeyme", email = "charles.dufour@epfl.ch" },
]
requires-python = ">=3.13"
maintainers = [{ name = "Charles Dufour", email = "charles.dufour@epfl.ch" }]
license = { text = "MIT" }

dependencies = [
    "kneed>=0.8.5",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
    "numba>=0.63.1",
    "numpy==2.3.5",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
tests = ["pytest>=9.0.2", "coverage>=7.0.0", "pytest-cov>=6.0.0"]
docs = [
    "sphinx>=8.0.0",
    "furo>=2024.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-click>=6.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-automodapi>=0.18.0",
    "sphinx-copybutton>=0.5.0",
    "sphinxcontrib-bibtex>=2.6.0",
    "sphinx-inline-tabs>=2023.0.0",
    "sphinx-togglebutton>=0.3.0",
    "matplotlib>=3.10.8",
]

[project.urls]
Homepage = "https://github.com/dufourc1/pygraphon"
Documentation = "https://pygraphon.readthedocs.io"
Repository = "https://github.com/dufourc1/pygraphon"
"Bug Tracker" = "https://github.com/dufourc1/pygraphon/issues"
Download = "https://github.com/dufourc1/pygraphon/releases"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
